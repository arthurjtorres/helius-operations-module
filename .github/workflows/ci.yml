# CI das PRs: roda nos runners do GitHub (repositório público), nunca na VM
name: CI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - run: yarn test --ci
      # Bloqueia só high/critical em dependências de runtime. O yarn 1 ignora --level no código de saída
      # (máscara: 2 low, 4 moderate, 8 high, 16 critical), então o passo confere os bits 8 e 16.
      - run: yarn audit --groups dependencies --level high || [ $(( $? & 24 )) -eq 0 ]
