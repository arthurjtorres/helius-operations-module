services:
  application:
    env_file:
      - ../.env  # Caminho relativo para a pasta raiz
    # Papel próprio no banco (T26); sem a variável nova vale DB_USER/DB_PASS. Senhas dos outros módulos ficam vazias.
    environment:
      - DB_USER=${DB_USER_OPERATIONS:-${DB_USER}}
      - DB_PASS=${DB_PASS_OPERATIONS:-${DB_PASS}}
      - DB_PASS_CONTROL=
      - DB_PASS_REGISTRY=
      - DB_PASS_JURISTIC=
    build: .
    image: helius/operations:${VERSION:-latest}
    ports:
      - "${PORT_API_OPERACIONAL}:${PORT_API_OPERACIONAL}"
    # Roda só a imagem: sem bind mount do código nem volume de node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${PORT_API_OPERACIONAL}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    container_name: modulo-operacional
    restart: always
    networks:
      - helius_net

networks:
  helius_net:
    external: true
